name: Playwright Hybrid QA
on:
  push:
    branches: [feature/ui-tests]
  pull_request:
    branches: [feature/ui-tests]
  workflow_dispatch:
jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: 'true'
      TEST_ENV: staging
      UI_BASE_URL: ${{ vars.STAGING_UI_URL || 'https://automationexercise.com' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run all UI test cases
        run: npx playwright test --project=ui-chromium
      - name: Add test results to the job summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          const reportPath = 'test-results/results.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!existsSync(reportPath)) {
            appendFileSync(
              summaryPath,
              '## UI test results\n\nPlaywright JSON report was not generated; tests may not have started.\n',
            );
            process.exit(0);
          }

          const { stats } = JSON.parse(readFileSync(reportPath, 'utf8'));
          const { expected: passed, unexpected: failed, flaky, skipped } = stats;
          const total = passed + failed + flaky + skipped;

          const summary = [
            '## UI test results',
            '',
            '| Result | Count |',
            '| --- | ---: |',
            `| Total | ${total} |`,
            `| Passed | ${passed} |`,
            `| Flaky | ${flaky} |`,
            `| Failed | ${failed} |`,
            `| Skipped | ${skipped} |`,
            '',
          ].join('\n');

          appendFileSync(summaryPath, summary);
          console.log(
            `Total: ${total}; Passed: ${passed}; Flaky: ${flaky}; Failed: ${failed}; Skipped: ${skipped}`,
          );
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

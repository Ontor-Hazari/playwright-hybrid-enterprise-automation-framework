name: Nightly Regression
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [ui-chromium]
    env:
      CI: 'true'
      TEST_ENV: staging
      UI_BASE_URL: ${{ vars.STAGING_UI_URL || 'https://automationexercise.com' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
